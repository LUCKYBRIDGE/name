name: Validate naming data

on:
  push:
    paths:
      - "data/**"
      - "tests/**"
      - "scripts/validate/**"
      - ".github/workflows/data-validation.yml"
  pull_request:
    paths:
      - "data/**"
      - "tests/**"
      - "scripts/validate/**"
      - ".github/workflows/data-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate structured naming data
        run: node scripts/validate/validate-data.mjs
