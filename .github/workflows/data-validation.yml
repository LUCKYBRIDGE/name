name: Validate naming data

on:
  push:
    paths:
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "knowledge/**"
      - "workflows/**"
      - "templates/**"
      - "docs/**"
      - "sources/**"
      - "research/**"
      - "README.md"
      - "INDEX.md"
      - "AGENTS.md"
      - "package.json"
      - ".github/workflows/data-validation.yml"
  pull_request:
    paths:
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "knowledge/**"
      - "workflows/**"
      - "templates/**"
      - "docs/**"
      - "sources/**"
      - "research/**"
      - "README.md"
      - "INDEX.md"
      - "AGENTS.md"
      - "package.json"
      - ".github/workflows/data-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check reproducible derived data
        run: npm run check:derived
      - name: Validate structured naming data
        run: npm run validate:data
