name: Build lunar-python saju crosscheck vectors

on:
  push:
    branches:
      - saju-golden-vectors-20261122
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: saju-golden-vectors-20261122
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned crosscheck implementation
        run: pip install --disable-pip-version-check lunar-python==1.4.9
      - name: Generate crosscheck vectors
        run: python scripts/build/build-saju-golden-vectors.py
      - name: Refresh source audit metadata
        run: |
          node scripts/audit/build-source-audit.mjs
          node scripts/audit/build-source-rights.mjs
      - name: Commit generated vectors
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- tests/사주-팔자-교차검증-lunar-python-1.4.9.csv data/meta/source-audit.csv data/meta/source-rights.csv)" ]; then
            echo "Crosscheck vectors and source audit are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/사주-팔자-교차검증-lunar-python-1.4.9.csv data/meta/source-audit.csv data/meta/source-rights.csv
          git commit -m "tests: add pinned lunar-python saju crosscheck vectors"
          git push origin HEAD:saju-golden-vectors-20261122
