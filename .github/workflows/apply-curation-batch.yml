name: Apply naming curation batch

on:
  push:
    branches:
      - data-depth-expansion-20261122
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data-depth-expansion-20261122
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply reviewed curation batch
        run: node scripts/curation/apply-naming-curation-batch-20261122.mjs
      - name: Commit curated data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/hanja/semantics/naming-meaning-curated.csv; then
            echo "Curation batch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hanja/semantics/naming-meaning-curated.csv
          git commit -m "data: apply second naming-meaning curation batch"
          git push origin HEAD:data-depth-expansion-20261122
